# 肥鱼手机推荐 AVD 配置（配置模板，不含镜像/快照）
# 生成方式（先用 sdkmanager 安装 system image，插件/脚本不代装）：
#   sdkmanager "emulator" "system-images;android-34;google_apis;x86_64"
#   avdmanager create avd -n feiyu-phone -k "system-images;android-34;google_apis;x86_64" -d medium_phone
# 然后可把下列键合并进 ~/.android/avd/<name>.avd/config.ini（按需）。
#
# 实测环境：Android emulator 37.2.12，Android 14 (android-34)，google_apis/x86_64
avd.id = feiyu-phone
avd.name = feiyu-phone
abi.type = x86_64
image.sysdir.1 = system-images/android-34/google_apis/x86_64/
tag.id = google_apis
tag.display = Google APIs
hw.cpu.arch = x86_64
hw.cpu.ncore = 4
hw.ramSize = 1536M
hw.lcd.width = 1080
hw.lcd.height = 2400
hw.lcd.density = 420
hw.keyboard = yes
hw.gpu.enabled = yes
hw.gpu.mode = auto
disk.dataPartition.size = 6G
PlayStore.enabled = no
# 启动建议（与插件 emulator 适配器一致）：-no-window -no-audio -no-boot-anim
# -gpu angle_indirect（有 DRM）或 swiftshader_indirect -memory 2048 -cores 4
